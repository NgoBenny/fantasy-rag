name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy
          POSTGRES_DB: fantasy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fantasy -d fantasy"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://fantasy:fantasy@localhost:5432/fantasy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      # live source checks are deselected by pyproject addopts; CI never calls nflverse or Sleeper
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks and builds; pages render per request, so no API is needed here.
      # Playwright (e2e/) runs locally against the real API + dev database.
      - run: npm run build
