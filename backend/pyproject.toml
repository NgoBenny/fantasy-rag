[project]
name = "fantasy-rag"
version = "0.1.0"
description = "Fantasy NFL assistant: typed tools over stats, projections and news, with citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.17.0",
    "fastapi>=0.156.2",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "nflreadpy>=0.1.5,<0.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fantasy-rag = "fantasy_rag.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyyaml",
    "ruff",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) would otherwise make ruff treat alembic as first-party
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not llm'"
markers = [
    "live: hits live external APIs (deselected by default; run with -m live)",
    "db: needs a reachable Postgres at DATABASE_URL",
    "llm: calls the paid Claude API (deselected by default; run with -m llm)",
]

[[tool.mypy.overrides]]
module = ["nflreadpy", "nflreadpy.*", "feedparser", "fastembed"]
ignore_missing_imports = true
