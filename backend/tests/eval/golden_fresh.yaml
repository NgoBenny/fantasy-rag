# Fresh held-out questions (Oct 21, 2026), written after the Phase 6 prompt fixes to test
# whether those fixes generalize. Each targets one failure kind found in the full run,
# with a different player, league or wording than the question the fix was written from:
#   league-format article -> n20;  "only"/"all" claims -> a15;  news vs fact -> h11/h12;
#   lineup holes -> a02/a04.
# Not part of the frozen 60-question rubric: scored separately (`--only fresh`) and never
# used to tune prompts; reworded by the user (via Codex). Same fields as
# golden_answers.yaml. Data pinned to week 7. The expectations were written before these
# ran, so they are fresh regression cases now, not a private test set.

fresh:
  - id: f01
    category: league_format_article
    question: anyone worth grabbing in guillotine this week?
    context: {leagues: mine, selected: null}
    tools: [search_news]
    correct_if:
      - treats guillotine as knockout and cites the Week 7 knockout pickups story
    fail_if:
      - asks which of the user's leagues first
      - names pickups that no cited story names

  - id: f02
    category: only_claim
    question: maye my only decent qb option?
    context: {leagues: mine, selected: 3}
    tools: [optimize_lineup|project_player|compare_start_sit]
    require: [{tool: optimize_lineup|project_player|compare_start_sit, players: [Drake Maye]}]
    correct_if:
      - notes Tyler Shough is also rostered and has a projection (lower than Maye's)
    fail_if:
      - says Maye is the only QB, or the only one with a projection

  - id: f03
    category: all_claim
    question: my starters all good to go?
    context: {leagues: mine, selected: 1}
    tools: [optimize_lineup]
    correct_if:
      - says no starter has an injury designation, from the full recommended lineup
      - keeps bench players (A.J. Brown Questionable, Jeremiyah Love Out) apart from starters
      - mentions the empty DEF slot is not a player
    fail_if:
      - calls a starter injured, or a bench player a starter

  - id: f04
    category: speculation_vs_fact
    question: wait saquon got traded to seattle?
    context: {leagues: mine, selected: null}
    tools: [search_news]
    correct_if:
      - says the story is a list of proposed trade-deadline moves, not a completed trade
    fail_if:
      - says the trade happened
      - opens with a flat "No." or "Yes."

  - id: f05
    category: lineup_hole
    question: check my other half ppr lineup—anything i should fix?
    context: {leagues: mine, selected: 3}
    tools: [optimize_lineup]
    correct_if:
      - names the recommended change (Harold Fannin Jr. in for Dameon Pierce at FLEX)
      - flags the empty DEF slot as unsupported, without naming a defense to add
      - says Zach Charbonnet (PUP) can't play
    fail_if:
      - says no changes are needed

  - id: f06
    category: league_format_article
    question: who do experts like in superflex this week?
    context: {leagues: mine, selected: null}
    tools: [search_news]
    correct_if:
      - cites the Week 7 superflex rankings story and says only the headline/excerpt is available
    fail_if:
      - asks which of the user's leagues first
      - invents ranking positions not in a cited result

  # Added Oct 21, 2026 after the first fresh run. f01-f06 and their results stay as they
  # were; these are reported separately as replacements or new cases.
  - id: f07
    category: league_format_personal
    question: who should i grab for my guillotine team?
    context: {leagues: mine, selected: null}
    tools: []
    expect_type: clarification
    correct_if:
      - asks which of the user's leagues, since the advice depends on their roster
    fail_if:
      - recommends players without a league

  - id: f08
    category: lineup_hole
    replaces: f05   # f05 stays recorded: "my other half ppr lineup" was ambiguous with league 3 selected
    question: anything i should fix in this lineup?
    context: {leagues: mine, selected: 3}
    tools: [optimize_lineup]
    correct_if:
      - names the recommended change (Harold Fannin Jr. in for Dameon Pierce at FLEX)
      - flags the empty DEF slot as unsupported, without naming a defense to add
      - says Zach Charbonnet (PUP) can't play
    fail_if:
      - says no changes are needed

# Phase 10 usage questions (Oct 21, 2026), held out: written before any paid run, never
# used to tune prompts. Run with `--only u01,...,u08,o05` (o05, the SQL snap-share
# question in golden_answers.yaml, must still call no tools).
  - id: u01
    category: usage
    question: what's jahmyr gibbs' snap share been lately?
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Jahmyr Gibbs]}]
    correct_if: [gives snap shares copied from get_usage, with their weeks]
    fail_if: [computes a share or a change the tool didn't give]

  - id: u02
    category: usage
    question: how many targets has xavier worthy been getting the last few games?
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Xavier Worthy]}]
    correct_if: [lists targets per game with weeks from get_usage]
    fail_if: [predicts future targets]

  - id: u03
    category: usage
    question: is tyler higbee's role growing?
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Tyler Higbee]}]
    correct_if: [states the usage facts get_usage gives as observations]
    fail_if: [says the usage change will continue, or gives a reason no tool states]

  - id: u04
    category: usage
    question: who gets more red zone work, gibbs or rhamondre stevenson?
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Jahmyr Gibbs, Rhamondre Stevenson]}]
    correct_if: [compares red-zone looks copied from get_usage over the same games]
    fail_if: [adds the looks up or computes a difference]

  - id: u05
    category: usage
    question: puka nacua target share vs garrett wilson
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Puka Nacua, Garrett Wilson]}]
    correct_if: [gives both players' target shares as the tool states them]
    fail_if: [computes a new percentage]

  - id: u06
    category: usage
    question: has bijan robinson's workload changed recently?
    context: {leagues: mine, selected: null}
    tools: [get_usage]
    require: [{tool: get_usage, players: [Bijan Robinson]}]
    correct_if: [uses carries, carry share or snap share from get_usage]
    fail_if: [explains why the workload changed without a cited source]

  - id: u07
    category: usage
    question: devaughn vele snaps and targets this season
    context: {leagues: mine, selected: null}
    tools: [get_usage|get_player_stats]
    require: [{tool: get_usage|get_player_stats, players: [Devaughn Vele]}]
    correct_if: [snap share and targets copied from the tool, with weeks]
    fail_if: [states a number no tool gave]

  - id: u08
    category: usage
    question: why did gibbs get fewer targets last week?
    context: {leagues: mine, selected: null}
    tools: [get_usage, search_news]
    require: [{tool: get_usage, players: [Jahmyr Gibbs]}]
    correct_if: [reports the targets from get_usage, and gives a reason only if a cited story states one]
    fail_if: [invents a reason, or presents the usage change itself as the cause]

# Phase 11 (Nov 5, 2026): why a projection moved. Written before the first run; the
# answers are also read by hand against their cited steps, because the number check can't
# tell a step the writer added up from one the tool returned.
  - id: p01
    category: projection_change
    question: why did bucky irving's projection go up?
    context: {leagues: mine, selected: null}
    tools: [explain_projection]
    require: [{tool: explain_projection, players: [Bucky Irving]}]
    correct_if: [calls it a recomputed baseline change and explains it with the tool's week steps]
    fail_if:
      - blames an injury, role or matchup for the change
      - computes a sum or difference the tool didn't return

  - id: p02
    category: projection_change
    question: what changed for ja'marr chase's projection since week 5?
    context: {leagues: mine, selected: null}
    tools: [explain_projection]
    require: [{tool: explain_projection, players: [Ja'Marr Chase]}]
    correct_if: [covers weeks 5 to now with each game's step and the bye week as no change]
    fail_if:
      - computes a sum or difference the tool didn't return
      - presents it as the number shown back then rather than recomputed

  - id: p03
    category: projection_change
    question: josh allen's projection moved, why?
    context: {leagues: mine, selected: 1}
    tools: [explain_projection]
    require: [{tool: explain_projection, players: [Josh Allen]}]
    correct_if: [uses league 1 scoring and the tool's steps]
    fail_if: [blames an injury, role or matchup for the change]

  - id: p04
    category: projection_change
    question: why is jaylen warren's projection different from last week?
    context: {leagues: mine, selected: null}
    tools: [explain_projection]
    require: [{tool: explain_projection, players: [Jaylen Warren]}]
    correct_if: [separates the baseline change from the served projection (he is on bye)]
    fail_if: [shows a baseline change beside a 0 projection without saying why it is 0]

  - id: p05
    category: projection_change
    question: did tyler loop's projection drop because he got hurt?
    context: {leagues: mine, selected: null}
    tools: [explain_projection]
    require: [{tool: explain_projection, players: [Tyler Loop]}]
    correct_if:
      - says the baseline doesn't use injuries, and that his served projection is 0 because he is on IR
    fail_if: [says the injury changed the baseline projection]

  - id: p06
    category: projection_change
    question: why did gibbs' projection change and is there any news on him?
    context: {leagues: mine, selected: null}
    tools: [explain_projection, search_news]
    require: [{tool: explain_projection, players: [Jahmyr Gibbs]}]
    correct_if: [explains the change from the steps and reports news separately, not as its cause]
    fail_if: [presents a news story as the cause of the change]

# Router evaluation only, as in golden_answers.yaml: scores are reported under the
# original and the revised rubric.
route_overrides:
  f02:
    tools: [optimize_lineup|project_player|compare_start_sit|compare_players]
    require: [{tool: optimize_lineup|project_player|compare_start_sit|compare_players, players: [Drake Maye, Tyler Shough]}]
    why: >-
      Reviewed Oct 21, 2026: the run's compare_players result gave both QBs' points per
      game in league 3 scoring (Maye 19.67, Shough 19.52), which supports calling Shough a
      decent option. A tool counts only when its result supports the recommendation, so
      the revised rule also requires both QBs in it.
