# Held-out news set (review of PR #8): harder cases, evaluated through the real
# `search_news` tool (player preference + date window), on stories ingested by Oct 20,
# 2026. None of these questions was used to tune search or the weak-evidence threshold.
#
# expect:
#   hit      - a `relevant` story in the top 5
#   top1     - the first result is one of `relevant` (e.g. the latest report)
#   phase6   - no supporting story exists. Retrieval always returns its best candidates;
#              saying "no supporting story" is the answer writer's job (Phase 6), where
#              these are graded. A cosine-similarity cutoff was tried and dropped: it
#              flagged 4 of 9 answerable questions here.
#   ambiguous - the player name is shared; the tool must refuse to guess
# `avoid`: a story that must not come first (an older, contradicted report).

# Graded on a frozen copy of the corpus (`fantasy-rag eval news-snapshot`, table
# news_eval_*), so later stories or edits can't change the score. It holds the stories
# stored by labelling time (`through_document`: IDs follow insertion order; dates don't,
# because feeds revise them), as they read when captured on Oct 28, 2026: earlier
# revisions of those stories were overwritten and can't be recovered. `time` is when the
# labels were written; `days` windows count back from it.
