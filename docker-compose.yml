# Phase 0: database only. api and worker services arrive with their code (Phases 7 and 9).
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fantasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantasy}
      POSTGRES_DB: ${POSTGRES_DB:-fantasy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantasy} -d ${POSTGRES_DB:-fantasy}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
